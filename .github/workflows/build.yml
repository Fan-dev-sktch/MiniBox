# 推送 v* 标签（如 v1.1.0）或手动触发：自动打包 Windows / macOS / Linux 并发布到 Releases
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos-arm64
          - os: macos-13
            name: macos-x64
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --clean packaging/minibox.spec

      - name: Windows 安装包 + 便携版
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$("${{ github.ref_name }}".TrimStart('v') -replace '^main$','1.7.0') packaging\installer.nsi
          New-Item dist\MiniBox\portable -ItemType File | Out-Null
          Compress-Archive -Path dist\MiniBox -DestinationPath dist\MiniBox-windows-portable.zip
      - name: macOS 磁盘映像
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname MiniBox -srcfolder dist/MiniBox.app -ov -format UDZO dist/MiniBox-${{ matrix.name }}.dmg
      - name: Linux 压缩包
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/MiniBox-linux-x64.tar.gz MiniBox

      - uses: actions/upload-artifact@v4
        with:
          name: MiniBox-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: false  # 已手动上传的精简版安装包不覆盖
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
