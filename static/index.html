<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniBox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='20' rx='4' fill='%230f766e'/%3E%3Crect x='3' y='5' width='26' height='7' rx='3' fill='%2314b8a6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#ffffff; --side:#f5f6f5; --panel:#ffffff; --sunken:#f1f3f2; --line:#e9ecea; --line2:#d9dedb;
  --ink:#1b1f1d; --ink2:#59605c; --ink3:#8b928e;
  --acc:#0f766e; --acc-ink:#ffffff; --acc-soft:#e3f2ef; --sel:#e8f3f1;
  --danger:#c2410c; --ok:#15803d;
  --k-image:#7c3aed; --k-video:#db2777; --k-audio:#ea580c; --k-pdf:#dc2626; --k-doc:#2563eb; --k-archive:#a16207; --k-other:#64748b; --k-dir:#0f766e;
  --shadow:0 10px 30px -10px rgba(20,20,10,.18), 0 2px 6px rgba(20,20,10,.06);
  --r:10px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#181a19; --side:#141615; --panel:#1f2221; --sunken:#252928; --line:#2b2f2d; --line2:#3a3f3d;
  --ink:#e9ecea; --ink2:#a5aca8; --ink3:#767d79;
  --acc:#2dd4bf; --acc-ink:#062b27; --acc-soft:#183330; --sel:#1b2f2c;
  --danger:#fb923c; --ok:#4ade80;
  --k-image:#a78bfa; --k-video:#f472b6; --k-audio:#fb923c; --k-pdf:#f87171; --k-doc:#60a5fa; --k-archive:#facc15; --k-other:#94a3b8; --k-dir:#2dd4bf;
  --shadow:0 10px 30px -10px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#181a19; --side:#141615; --panel:#1f2221; --sunken:#252928; --line:#2b2f2d; --line2:#3a3f3d;
  --ink:#e9ecea; --ink2:#a5aca8; --ink3:#767d79;
  --acc:#2dd4bf; --acc-ink:#062b27; --acc-soft:#183330; --sel:#1b2f2c;
  --danger:#fb923c; --ok:#4ade80;
  --k-image:#a78bfa; --k-video:#f472b6; --k-audio:#fb923c; --k-pdf:#f87171; --k-doc:#60a5fa; --k-archive:#facc15; --k-other:#94a3b8; --k-dir:#2dd4bf;
  --shadow:0 10px 30px -10px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Microsoft YaHei UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::selection{background:var(--acc-soft)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100vh}
.hd{display:flex;align-items:center;gap:18px;padding:12px 24px;border-bottom:1px solid var(--line)}
.hd .brand{padding:0;font-size:15px}
.tabs{display:flex;gap:4px;margin:0 auto;background:var(--sunken);padding:3px;border-radius:10px}
.tab{border:0;background:none;padding:6px 22px;border-radius:8px;font-size:14px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab .cnt{font-size:11px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;padding:0 5px;font-weight:600}
.tab .cnt:empty{display:none}
.icon-btn.ghost{border-color:transparent;background:none}
.cats{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.cats button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--ink2);font-size:14px;white-space:nowrap}
.cats button:hover{color:var(--ink);background:var(--sunken)}
.cats button.on{color:var(--ink);font-weight:600;background:var(--sunken)}
.cats button.drop{outline:2px dashed var(--acc)}
/* ---------- sidebar */
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto;background:var(--side)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.1px;font-size:15px;min-width:120px}
.brand svg{display:block}
.side h6{margin:12px 8px 4px;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.06em}
.loc{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;color:var(--ink2);border:0;background:none;text-align:left;width:100%}
.loc:hover{background:var(--sunken);color:var(--ink)}
.loc.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav{font-size:14.5px;font-weight:600;color:var(--ink);padding:9px 8px}
.nav svg{opacity:1}
.nav.on{color:var(--acc)}

.loc svg{flex:none;opacity:.8}
.loc .x{margin-left:auto;opacity:0;padding:0 4px;border-radius:4px}
.loc:hover .x{opacity:.6}.loc .x:hover{opacity:1;background:var(--line)}
.loc.drop{outline:2px dashed var(--acc)}
.side .spacer{flex:1}
.tools{font-size:12px;color:var(--ink3);padding:8px;display:grid;gap:4px}
.tools span{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.dot.on{background:var(--ok)}
/* ---------- main */
.main{display:flex;flex-direction:column;min-width:0;flex:1;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 24px 10px}
.icon-btn.menu-btn{display:none}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow:hidden;white-space:nowrap;font-size:15px}
.crumbs button:last-child{font-size:20px}
.crumbs button{border:0;background:none;padding:4px 6px;border-radius:6px;color:var(--ink2);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.crumbs button:last-child{color:var(--ink);font-weight:600}
.crumbs button:hover{background:var(--sunken)}
.crumbs button.drop{outline:2px dashed var(--acc)}
.crumbs .sep{color:var(--ink3)}
.search{position:relative}
.search input{width:34px;padding:7px 10px 7px 30px;border:1px solid transparent;border-radius:8px;background:none;outline:none;cursor:pointer;transition:width .18s,border-color .18s}
.search input:hover{background:var(--sunken)}
.search input:focus,.search input:not(:placeholder-shown){width:190px;border-color:var(--line);background:var(--panel);cursor:text}
.search input:focus{border-color:var(--acc)}
.search input::placeholder{color:transparent}.search input:focus::placeholder{color:var(--ink3)}
.search svg{pointer-events:none;position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--sunken)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:550}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--ink2)}
.icon-btn:hover{color:var(--ink);background:var(--sunken)}
.bar2{display:flex;align-items:center;gap:6px;padding:0 24px 6px;flex-wrap:wrap;min-height:4px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bar2 .r{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--ink3);font-size:12.5px}
/* ---------- list */
.listwrap{flex:1;overflow:auto;padding:0 24px 120px;position:relative}
.list{background:transparent}
.row:first-child{border-top:0}
.empty.big{padding:90px 20px;line-height:1.8}
.empty.big .box{color:var(--acc);display:block;margin:0 auto 6px;width:72px}
.empty.big .di{width:56px;height:56px;border-radius:16px;background:var(--sunken);color:var(--ink3);display:grid;place-items:center;margin:0 auto 14px}
.empty.big b{font-size:17px}
.crumbs:empty{display:none}
.crumbs .back{color:var(--acc)!important;font-weight:500}
.crumbs button:last-child{font-size:inherit!important}
.row{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:center;gap:14px;padding:8px 12px;border-radius:10px;user-select:none;cursor:default}
.row:first-child{border-top:0}
.row.head{position:sticky;top:0;z-index:2;background:var(--bg);font-size:12px;color:var(--ink3);padding-top:9px;padding-bottom:9px}
.row.head button{border:0;background:none;padding:0;color:inherit;text-align:left;font-size:12px}
.row.head button.on{color:var(--ink)}
.row:not(.head):hover{background:var(--sunken)}
.row.sel{background:var(--sel)!important}
.row.drop{outline:2px dashed var(--acc);outline-offset:-3px}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--acc-soft)}}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{display:block;font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .nm{font-size:14px}
.row .sz,.row .tm{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.row .sz{text-align:right}
.ck{width:16px;height:16px;border:1.5px solid var(--line2);border-radius:4px;display:grid;place-items:center;background:var(--panel)}
.sel .ck,.ck.on{background:var(--acc);border-color:var(--acc)}
.sel .ck:after,.ck.on:after{content:"";width:8px;height:4px;border:2px solid var(--acc-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ck.part{background:var(--acc);border-color:var(--acc)}.ck.part:after{content:"";width:8px;height:2px;background:var(--acc-ink)}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.02em;overflow:hidden;position:relative}
.ic img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;background:var(--sunken);opacity:0;transition:opacity .15s}
.ic .lb{position:relative}
.ic.dir{background:none;color:var(--k-dir)}
.grid .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;padding:6px 0;background:transparent;border:0}
.grid .row.head{display:none}
.grid .row{grid-template-columns:1fr;border:1px solid transparent;border-radius:10px;padding:10px;justify-items:center;text-align:center;gap:6px;position:relative;background:var(--panel)}
.grid .row .ck{position:absolute;top:8px;left:8px;opacity:0}
.grid .row:hover .ck,.grid .row.sel .ck{opacity:1}
.grid .row .ic{width:100%;height:auto;aspect-ratio:4/3;border-radius:10px;font-size:15px}
.grid .row .ic.dir svg{width:62px;height:62px}
.grid .row .ic svg{width:34px;height:34px}
.grid .row .nm{width:100%;font-size:13px}
.grid .row .sz,.grid .row .tm,.grid .row .sub{display:none}
.empty{padding:70px 20px;text-align:center;color:var(--ink3);grid-column:1/-1}
.empty b{display:block;color:var(--ink2);font-weight:550;margin-bottom:4px;font-size:15px}
.dropzone{position:fixed;inset:0;background:color-mix(in srgb,var(--acc) 12%,transparent);border:3px dashed var(--acc);z-index:50;display:none;place-items:center;font-size:18px;font-weight:600;color:var(--acc);pointer-events:none}
.dropzone.on{display:grid}
/* ---------- action bar */
.actions{position:fixed;left:50%;transform:translate(-50%,20px);bottom:22px;background:var(--ink);color:var(--bg);border-radius:12px;padding:6px;display:flex;gap:2px;align-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.18s;z-index:20;max-width:calc(100vw - 32px);overflow-x:auto}
.actions.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.actions .cnt{padding:0 10px 0 8px;font-size:13px;opacity:.75;white-space:nowrap}
.actions button{border:0;background:none;color:inherit;padding:7px 10px;border-radius:8px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.actions button:hover{background:color-mix(in srgb,var(--bg) 16%,transparent)}
.actions .hl{background:var(--acc);color:var(--acc-ink);font-weight:550}
.actions .hl:hover{background:var(--acc);filter:brightness(1.08)}
.actions .vr{width:1px;height:20px;background:currentColor;opacity:.2;margin:0 4px}
/* ---------- jobs */
.jobs{position:fixed;right:18px;bottom:18px;width:340px;max-height:56vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;flex-direction:column;z-index:30;overflow:hidden}
.jobs.on{display:flex}
.jobs header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.jobs header .btn{padding:3px 8px;font-size:12px;font-weight:400}
.jobs .jl{overflow:auto}
.job{padding:10px 12px;border-top:1px solid var(--line);font-size:13px}
.job:first-child{border-top:0}
.job .t{display:flex;gap:8px;align-items:baseline}
.job .t b{font-weight:550;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .st{font-size:12px;color:var(--ink3);white-space:nowrap}
.job .st.ok{color:var(--ok)}.job .st.err{color:var(--danger)}
.pb{height:4px;background:var(--sunken);border-radius:4px;margin-top:7px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.job .o{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.job .o button{border:1px solid var(--line);background:var(--sunken);border-radius:6px;padding:2px 7px;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .e{margin-top:5px;color:var(--danger);font-size:12px;word-break:break-all}
.job .x{border:0;background:none;color:var(--ink3);padding:0 2px;font-size:12px}
.job .x:hover{color:var(--danger)}
.jobs-fab{position:fixed;right:18px;bottom:18px;z-index:29;display:none}
.jobs-fab.on{display:inline-flex}
body.has-sel .jobs-fab{bottom:76px}
/* ---------- modal */
.modal{position:fixed;inset:0;background:rgba(10,10,8,.45);display:none;place-items:center;z-index:60;padding:16px}
.modal.on{display:grid}
.dlg{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.dlg h3{margin:0 0 4px;font-size:16px}
.dlg .muted{color:var(--ink3);font-size:12.5px;margin:0 0 14px}
.dlg label.f{display:block;font-size:12.5px;color:var(--ink2);margin:14px 0 6px}
.dlg input[type=text],.dlg input[type=password],.dlg select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);outline:none}
.dlg input:focus,.dlg select:focus{border-color:var(--acc)}
.dlg .fmts{display:flex;flex-wrap:wrap;gap:6px}
.dlg .fmts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-weight:600;font-size:12.5px;min-width:56px}
.dlg .fmts button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.dlg .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dlg .seg button{border:0;background:var(--bg);padding:6px 12px;font-size:13px}
.dlg .seg button+button{border-left:1px solid var(--line)}
.dlg .seg button.on{background:var(--ink);color:var(--bg)}
.dlg .rng{display:flex;align-items:center;gap:10px}
.dlg .rng input{flex:1;accent-color:var(--acc)}
.dlg .chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px}
.dlg .chk input{accent-color:var(--acc);width:16px;height:16px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.dlg .caps{display:grid;gap:4px;font-size:13px;color:var(--ink3)}.dlg .caps .on{color:var(--ink)}.dlg .caps em{font-style:normal;color:var(--ink3);margin-left:6px;font-size:12px}
.dlg .note{font-size:12px;color:var(--ink3);margin-top:8px}
.dlg .tree{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.dlg .tree button{display:flex;width:100%;text-align:left;border:0;background:none;padding:6px 10px;gap:6px;align-items:center}
.dlg .tree button:hover{background:var(--sunken)}
.dlg .tree button.on{background:var(--acc-soft)}
/* ---------- preview */
.pv{position:fixed;inset:0;background:rgba(8,8,6,.86);z-index:70;display:none;flex-direction:column;color:#eee}
.pv.on{display:flex}
.pv header{display:flex;align-items:center;gap:10px;padding:12px 16px}
.pv header b{flex:1;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv header button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#eee;border-radius:8px;padding:6px 11px}
.pv header button:hover{background:rgba(255,255,255,.14)}
.pv .body{flex:1;display:grid;place-items:center;min-height:0;padding:0 56px 20px;position:relative}
.pv .body img,.pv .body video{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.pv .body iframe{width:100%;height:100%;border:0;background:#fff;border-radius:6px}
.pv .body pre{width:min(900px,100%);height:100%;overflow:auto;margin:0;background:#1b1b19;color:#ddd;padding:16px;border-radius:8px;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.pv .arc{width:min(700px,100%);height:100%;overflow:auto;background:#1b1b19;border-radius:8px;padding:6px 0;font-size:13px}
.pv .arc div{display:flex;padding:4px 14px;gap:10px}.pv .arc div span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv .arc div span:last-child{color:#999;font-variant-numeric:tabular-nums}
.pv .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.08);color:#fff;width:40px;height:56px;border-radius:8px;font-size:20px}
.pv .nav:hover{background:rgba(255,255,255,.18)}
.pv .prev{left:8px}.pv .next{right:8px}
.pv .na{color:#aaa;text-align:center}
/* ---------- misc */
.menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:80;min-width:180px;display:none}
.menu.on{display:block}
.menu button{display:flex;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;text-align:left;gap:8px;align-items:center;font-size:13.5px}
.menu button:hover{background:var(--sunken)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .danger{color:var(--danger)}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-30px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:90;opacity:0;transition:.2s;pointer-events:none;font-size:13.5px;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}
.rename-in{width:100%;padding:3px 6px;border:1px solid var(--acc);border-radius:6px;background:var(--panel);outline:none}

/* ---------- 导入 */
.dlg.wide{width:min(720px,100%)}
.im-f{display:flex;gap:14px;align-items:flex-start;margin-top:12px}
.im-f>span{flex:none;width:30px;font-size:12.5px;color:var(--ink3);padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2);display:inline-flex;gap:5px;align-items:center;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips button:hover{border-color:var(--line2);color:var(--ink)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips button[data-zero]{opacity:.45}
.chips em{font-style:normal;font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.im-dates{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink3)}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = encodeURIComponent;
const S = {
  info:null, cwd:'', items:[], sel:new Set(), anchor:null, filter:'all',
  sort:{k:'name',d:1}, view:'list', query:'', searching:false, jobs:[], clientJobs:[], jobsOpen:false,
  lastJobState:{}, targets:{}
};
S.sort = {k:'mtime', d:-1};

async function api(url, body, method){
  const opt = body === undefined ? {method: method||'GET'} : {method: method||'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)};
  const r = await fetch(url, opt);
  let j = null; try{ j = await r.json() }catch(e){}
  if(!r.ok) throw new Error((j && j.error) || `请求失败 (${r.status})`);
  return j;
}
let toastT;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast on'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(err?' err':''), err?4200:2200) }
const fail = e => toast(e.message || String(e), true);

/* ---------------- 格式化 */
function fmtSize(b){ if(!b) return '—'; const u=['B','KB','MB','GB','TB']; let i=0; while(b>=1024&&i<4){b/=1024;i++} return (i?b.toFixed(b<10?1:0):b)+' '+u[i] }
function fmtTime(t){ const d=new Date(t*1000), n=new Date(); const p=x=>String(x).padStart(2,'0');
  if(d.toDateString()===n.toDateString()) return `今天 ${p(d.getHours())}:${p(d.getMinutes())}`;
  return `${d.getFullYear()===n.getFullYear()?'':d.getFullYear()+'-'}${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}` }
const KIND_NAME = {all:'全部', dir:'文件夹', image:'图片', video:'视频', audio:'音频', pdf:'PDF', doc:'文档', archive:'压缩包', other:'其他'};
const FOLDER_SVG = '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path opacity=".35" d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.6 0 1.2.25 1.6.7L12 6h6.5A2.5 2.5 0 0 1 21 8.5V9H3z"/><path d="M3 9h18v8.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>';
function iconHtml(it){
  if(it.dir) return `<div class="ic dir">${FOLDER_SVG}</div>`;
  const g = {image:'image', video:'video', audio:'audio', pdf:'doc', doc:'doc', archive:'archive'}[it.kind] || 'other';
  const glyph = catSvg(g, 18);
  if((it.kind==='image' || it.kind==='video') && it.path) return `<div class="ic" style="${tint(it.kind)}">${glyph}<img loading="lazy" src="/api/thumb?path=${enc(it.path)}&t=${it.mtime}" onload="this.style.opacity=1" onerror="this.remove()" alt=""></div>`;
  return `<div class="ic" style="${tint(it.kind)}">${glyph}</div>`;
}
const tint = k => `background:color-mix(in srgb, var(--k-${k}) 14%, transparent);color:var(--k-${k})`;
function parentOf(vp){ const i=vp.lastIndexOf('/'); return i<0? vp : vp.slice(0,i) }

/* ---------------- 初始化 */
const CAT_SVG = {
  image:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m5 18 5-5 3 3 2-2 4 4"/>',
  video:'<rect x="3.5" y="6" width="12" height="12" rx="2"/><path d="m15.5 10.5 5-3v9l-5-3"/>',
  audio:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',
  doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  archive:'<rect x="4" y="8" width="16" height="12" rx="2"/><path d="M3 4h18v4H3zM10 12h4"/>',
  other:'<circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>',
  all:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'
};
const CAT_COLOR = {image:'var(--k-image)', video:'var(--k-video)', audio:'var(--k-audio)', doc:'var(--k-doc)', archive:'var(--k-archive)', other:'var(--k-other)', all:'var(--acc)'};
const catSvg = (k, size=14) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${CAT_SVG[k]}</svg>`;
S.page = 'lib'; S.stats = {};
async function init(){
  S.info = await api('/api/info');
  renderFilters(); applyTheme();
  const h = location.hash.slice(1) ? decodeURIComponent(location.hash.slice(1)) : '';
  if(h === 'convert'){ await go('lib', null, true); showPage('convert') } else await go(h.startsWith('lib') ? h : 'lib');
  loadStats(); renderConv(); pollJobs();
}
function catOfPath(vp){ const seg = (vp||'').split('/')[1]; const c = S.info.categories.find(c=>c.name===seg); return c ? c.key : (vp==='lib' ? 'all' : null) }
async function loadStats(){ try{ S.stats = await api('/api/library/stats'); renderCats(); if(S.cwd==='lib' && S.page==='lib') renderList() }catch(_){} }
function renderCats(){
  const cur = S.page==='lib' ? catOfPath(S.cwd) : null;
  $('#cats').innerHTML = `<button data-go="lib" class="${cur==='all'?'on':''}">全部</button>` +
    S.info.categories.map(c => `<button data-go="${esc(c.path)}" class="${cur===c.key?'on':''}">${esc(c.name)}</button>`).join('');
  $('#navFiles').classList.toggle('on', S.page==='lib');
  $('#navConvert').classList.toggle('on', S.page==='convert');
  const n = S.conv.files.filter(f=>['ready','queued','running','uploading'].includes(f.status)).length; $('#convCnt').textContent = n || '';
}
function showPage(p){
  S.page = p; document.body.classList.toggle('page-convert', p==='convert');
  $('#libView').hidden = p!=='lib'; $('#convView').hidden = p!=='convert';
  if(p==='convert'){ history.replaceState(null,'','#convert'); S.sel.clear(); renderActions(); document.title = '格式转换 · MiniBox' }
  else { history.replaceState(null,'','#'+encodeURIComponent(S.cwd)); renderCrumbs() }
  renderCats();
}
function renderFilters(){
  const counts = {}; for(const it of S.items) counts[it.kind]=(counts[it.kind]||0)+1;
  let keys = ['all','dir','image','video','audio','pdf','doc','archive','other'].filter(k => k==='all' || counts[k]);
  if(!keys.includes(S.filter)) S.filter='all';
  keys = [];  // 极简：不再显示类型筛选，分类标签已经够用
  $('#filters').innerHTML = keys.map(k => `<button class="chip ${S.filter===k?'on':''}" data-f="${k}">${KIND_NAME[k]}${k!=='all'?` <span style="opacity:.6">${counts[k]}</span>`:''}</button>`).join(' ')
    + (counts.audio>1 && S.cwd!=='lib' ? ` <button class="playall" data-playall="audio">${ICON.play.replace(/18/g,'13')}播放全部音乐</button>` : '')
    + (counts.video>1 && S.cwd!=='lib' ? ` <button class="playall" data-playall="video">${ICON.play.replace(/18/g,'13')}连播视频</button>` : '');
}
function applyView(){  // 图片和视频用大图，其他用列表
  const c = catOfPath(S.cwd);
  $('#wrap').classList.toggle('grid', (c==='image' || c==='video') && !S.searching);
}

/* ---------------- 导航与列表 */
async function go(vp, highlight, stay){
  if(!stay && S.page!=='lib') showPage('lib');
  try{
    const r = await api(vp==='lib' ? '/api/recent' : '/api/list?path='+enc(vp));
    S.cwd = r.path; S.items = r.items; S.sel.clear(); S.anchor=null; S.searching=false; $('#q').value='';
    history.replaceState(null,'','#'+encodeURIComponent(S.cwd));
    renderCats(); renderCrumbs(); renderFilters(); applyView(); renderList(); renderActions();
    if(highlight){ const hs = [].concat(highlight); hs.forEach(h=>S.sel.add(h)); renderList(); renderActions();
      const el = document.querySelector(`.row[data-p="${CSS.escape(hs[0])}"]`); if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash') } }
  }catch(e){ fail(e) }
}
const refresh = () => S.searching ? doSearch() : go(S.cwd);
function renderCrumbs(){
  const parts = S.cwd.split('/'); const root = {name: {lib:'我的文件', stage:'转换暂存'}[parts[0]] || parts[0]};
  let acc = ''; const html = [];
  parts.forEach((p,i) => { acc = i? acc+'/'+p : p; html.push(`<button data-go="${esc(acc)}">${esc(i? p : (root? root.name : p))}</button>`) });
  $('#crumbs').innerHTML = parts.length > 2 ? `<button data-go="${esc(parentOf(S.cwd))}" class="back">‹ 返回</button>` + html.slice(1).join('<span class="sep">/</span>') : '';
  document.title = (parts.length>1? parts[parts.length-1] : (root?root.name:'')) + ' · MiniBox';
}
function visibleItems(){
  let a = S.items.filter(it => S.filter==='all' || it.kind===S.filter);
  const {k,d} = catOfPath(S.cwd)==='audio' ? {k:'name',d:1} : S.sort;
  const coll = new Intl.Collator('zh-CN',{numeric:true,sensitivity:'base'});
  a.sort((x,y) => (y.dir-x.dir) || d*(k==='name'? coll.compare(x.name,y.name) : k==='size'? x.size-y.size : x.mtime-y.mtime));
  return a;
}
function renderList(){
  const items = visibleItems();
  const inAll = S.cwd==='lib';
  let h = '';
  if(!items.length){
    h = S.searching ? `<div class="empty"><b>没有找到</b>换个关键词试试</div>`
      : `<div class="empty big"><span class="box"><svg width="72" height="72" viewBox="0 0 64 64" fill="none"><rect x="10" y="22" width="44" height="32" rx="7" fill="currentColor" opacity=".14"/><rect x="7" y="14" width="50" height="12" rx="5" fill="currentColor" opacity=".28"/><rect x="26" y="32" width="12" height="4" rx="2" fill="currentColor" opacity=".55"/></svg></span><b>${inAll?'还没有文件':'这里还没有文件'}</b>点右上角「导入」，按类型和时间挑出电脑里的文件<br>也可以直接把文件拖进窗口</div>`;
  }
  for(const it of items){
    const subPath = (S.searching || inAll) ? parentOf(it.path).split('/').slice(1).join(' / ') : '';
    const meta = [subPath, it.dir ? '' : fmtSize(it.size), fmtTime(it.mtime)].filter(Boolean).join('  ·  ');
    h += `<div class="row ${S.sel.has(it.path)?'sel':''}" data-p="${esc(it.path)}" draggable="true">
      ${iconHtml(it)}<span class="nm" title="${esc(it.name)}">${esc(it.name)}<span class="sub">${esc(meta)}</span></span></div>`;
  }
  $('#list').innerHTML = h;
  if(typeof markPlaying==='function' && MP.queue) markPlaying();
  $('#stat').textContent = '';
}
const byPath = p => S.items.find(i=>i.path===p);
function updateSel(){
  document.querySelectorAll('#list .row[data-p]').forEach(r => r.classList.toggle('sel', S.sel.has(r.dataset.p)));
  const items = visibleItems(), all = items.length && items.every(i=>S.sel.has(i.path)), some = items.some(i=>S.sel.has(i.path));
  const ck = $('#ckAll'); if(ck) ck.className = 'ck '+(all?'on':some?'part':'');
}
function selected(){ return [...S.sel].map(byPath).filter(Boolean) }

/* ---------------- 选择 / 交互 */
$('#list').addEventListener('click', e => {
  const tl = e.target.closest('.tile'); if(tl){ go(tl.dataset.go); return }
  const sb = e.target.closest('[data-sort]'); if(sb){ const k=sb.dataset.sort; S.sort = {k, d: S.sort.k===k? -S.sort.d : (k==='name'?1:-1)}; try{localStorage.setItem('mb.sort',JSON.stringify(S.sort))}catch(_){}; renderList(); return }
  if(e.target.id==='ckAll'){ const items=visibleItems(); const all=items.every(i=>S.sel.has(i.path)); items.forEach(i=> all? S.sel.delete(i.path) : S.sel.add(i.path)); renderList(); renderActions(); return }
  const row = e.target.closest('.row[data-p]'); if(!row){ return }
  const p = row.dataset.p, items = visibleItems().map(i=>i.path);
  if(e.shiftKey && S.anchor){ const a=items.indexOf(S.anchor), b=items.indexOf(p); if(!(e.metaKey||e.ctrlKey)) S.sel.clear(); items.slice(Math.min(a,b), Math.max(a,b)+1).forEach(x=>S.sel.add(x)) }
  else if(e.metaKey || e.ctrlKey || e.target.closest('.ck')){ S.sel.has(p)? S.sel.delete(p) : S.sel.add(p); S.anchor=p }
  else { S.sel.clear(); S.sel.add(p); S.anchor=p }
  updateSel(); renderActions();
});
$('#list').addEventListener('dblclick', e => { const row=e.target.closest('.row[data-p]'); if(row) open(byPath(row.dataset.p)) });
$('#wrap').addEventListener('click', e => { if(e.target===$('#wrap')){ S.sel.clear(); renderList(); renderActions() } });
$('#list').addEventListener('contextmenu', e => {
  const row = e.target.closest('.row[data-p]'); if(!row) return;
  e.preventDefault(); if(!S.sel.has(row.dataset.p)){ S.sel.clear(); S.sel.add(row.dataset.p); renderList(); renderActions() }
  showMenu(e.clientX, e.clientY);
});
function open(it){
  if(!it) return;
  if(it.dir) return go(it.path);
  if(it.kind==='audio' || it.kind==='video') return playItem(it);
  preview(it);
}

/* ---------------- 操作栏 */
async function loadTargets(names){
  const need = [...new Set(names.map(n => n.toLowerCase().split('.').pop()))].filter(e => !(e in S.targets));
  if(need.length){ const q = need.map(e=>'name=x.'+enc(e)).join('&'); const r = await api('/api/formats?'+q); for(const k in r) S.targets[k.split('.').pop()] = r[k] }
  const lists = names.map(n => S.targets[n.toLowerCase().split('.').pop()] || []);
  return lists.length ? lists.reduce((a,b)=>a.filter(x=>b.includes(x))) : [];
}
function actionDefs(sel){
  const files = sel.filter(i=>!i.dir), arcs = files.filter(i=>i.kind==='archive'), pdfs = files.filter(i=>i.ext==='pdf');
  const acts = [];
  if(sel.length && (sel.every(i=>i.kind==='audio') || sel.every(i=>i.kind==='video'))) acts.push(['play','播放',true]);
  if(arcs.length && arcs.length===sel.length) acts.push(['extract','解压',true]);
  if(files.length && files.length===sel.length) acts.push(['convert','转换格式', true]);
  if(sel.length===1 && ['audio','video'].includes(sel[0].kind)) acts.push(['trim','剪辑']);
  if(sel.length===1 && sel[0].ext==='pdf') acts.push(['pages','整理页面']);
  if(pdfs.length>=2 && pdfs.length===sel.length) acts.push(['merge','合并 PDF']);
  const sk = new Set(files.map(i=>shrinkKind(i.kind)));
  if(files.length && files.length===sel.length && sk.size===1 && !sk.has(null)) acts.push(['shrink','缩小体积']);
  acts.push(['compress','打包压缩']);
  return {acts, files, arcs};
}
function renderActions(){
  const sel = selected(), bar = $('#actions');
  document.body.classList.toggle('has-sel', !!sel.length);
  if(!sel.length){ bar.classList.remove('on'); return }
  const {acts} = actionDefs(sel);
  const hasConv = sel.every(i=>!i.dir && i.kind!=='archive' && i.kind!=='other');
  // 极简：只放最常用的 2~3 个，其余收进「···」

async function doAction(act){
  const sel = selected(); if(!sel.length) return;
  const paths = sel.map(i=>i.path);
  try{
    if(act==='play'){ return sel.length===1 ? playItem(sel[0]) : (sel[0].kind==='audio' ? playMusic(sel, 0) : openVideo(sel, 0)) }
    if(act==='extract') return startJob('extract', sel.filter(i=>i.kind==='archive').map(i=>i.path));
    if(act==='convert') return sendToConverter(sel);
    if(act==='compress') return compressDialog(sel);
    if(act==='merge') return startJob('merge_pdf', paths);
    if(act==='shrink') return shrinkDialog(sel);
    if(act==='trim') return trimDialog(sel[0]);
    if(act==='pages') return pagesDialog(sel[0]);
    if(act==='download'){ for(const p of paths){ const a=document.createElement('a'); a.href='/api/file?dl=1&path='+enc(p); a.download=''; document.body.appendChild(a); a.click(); a.remove(); await new Promise(r=>setTimeout(r,250)) } return }
    if(act==='rename') return renameInline(sel[0]);
    if(act==='move' || act==='copy') return moveDialog(sel, act==='copy');
    if(act==='delete') return deleteItems(paths);
    if(act==='reveal') return api('/api/reveal', {path: paths[0]}).catch(fail);
    if(act==='open') return open(sel[0]);
  }catch(e){ fail(e) }
}

/* ---------------- 缩小体积 */
const SHRINK_PRESETS = {
  image:[[100e3,'100 KB'],[200e3,'200 KB'],[500e3,'500 KB'],[1e6,'1 MB'],[2e6,'2 MB']],
  pdf:[[500e3,'500 KB'],[1e6,'1 MB'],[2e6,'2 MB'],[5e6,'5 MB'],[10e6,'10 MB']],
  video:[[10e6,'10 MB'],[25e6,'25 MB'],[50e6,'50 MB'],[100e6,'100 MB'],[200e6,'200 MB']],
  audio:[[1e6,'1 MB'],[3e6,'3 MB'],[5e6,'5 MB'],[10e6,'10 MB']]
};
const SHRINK_NOTE = {image:'会自动调整画质和尺寸，存成 JPG（透明图片保持 PNG）', pdf:'只压缩里面的图片，文字保持清晰可选', video:'存成 MP4，会自动选合适的分辨率；视频越长，能压到的最小体积越大', audio:'存成 MP3'};
const shrinkKind = k => k==='pdf' ? 'pdf' : ['image','video','audio'].includes(k) ? k : null;
const MB = 1000*1000;
function shrinkDefault(k){ let v = null; try{ v = +localStorage.getItem('mb.shrink.'+k) }catch(_){}; return v || {image:500e3, pdf:2e6, video:25e6, audio:5e6}[k] }
function shrinkPicker(k, cur, attrs){  // 目标大小选择：预设 + 自定义
  const presets = SHRINK_PRESETS[k], isPreset = presets.some(([v])=>v===cur);
  const unit = cur >= MB ? 'MB' : 'KB', num = isPreset ? '' : +(cur / (unit==='MB'?MB:1000)).toFixed(2);
  return `<div class="shr" ${attrs}>${presets.map(([v,l])=>`<button type="button" data-t="${v}" class="${v===cur?'on':''}">${l}</button>`).join('')}
    <span class="shr-c ${isPreset?'':'on'}"><input type="number" min="1" step="any" placeholder="自定义" value="${num}"><select>${['KB','MB'].map(u=>`<option ${u===unit?'selected':''}>${u}</option>`).join('')}</select></span></div>
    <div class="note">${SHRINK_NOTE[k]}</div>`;
}
function shrinkRead(box){  // 从选择器读出目标字节数
  const on = box.querySelector('button.on'); if(on) return +on.dataset.t;
  const n = parseFloat(box.querySelector('input').value); if(!(n>0)) return 0;
  return Math.round(n * (box.querySelector('select').value==='MB' ? MB : 1000));
}
function shrinkWire(root, onChange){
  root.addEventListener('click', e => { const b = e.target.closest('.shr button'); if(!b) return; const box = b.closest('.shr');
    box.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); box.querySelector('.shr-c').classList.remove('on'); box.querySelector('input').value=''; onChange && onChange(box) });
  root.addEventListener('input', e => { const box = e.target.closest('.shr'); if(!box) return;
    box.querySelectorAll('button').forEach(x=>x.classList.remove('on')); box.querySelector('.shr-c').classList.add('on'); onChange && onChange(box) });
  root.addEventListener('change', e => { const box = e.target.closest('.shr'); if(box && e.target.tagName==='SELECT') onChange && onChange(box) });
}
async function shrinkDialog(sel){
  const files = sel.filter(i=>!i.dir && shrinkKind(i.kind));
  if(!files.length) return toast('图片、视频、音乐和 PDF 才能缩小体积', true);
  const kinds = [...new Set(files.map(i=>shrinkKind(i.kind)))];
  if(kinds.length > 1) return toast('请一次只选同一类文件（比如都是图片）', true);
  const k = kinds[0], total = files.reduce((s,i)=>s+i.size,0);
  const html = `<h3>缩小体积</h3><p class="muted">${files.length===1?esc(files[0].name):files.length+' 个文件'} · 现在 ${fmtSize(total)}${files.length>1?'（每个文件分别压到目标以内）':''}</p>
    <label class="f">压到多大以内</label>${shrinkPicker(k, shrinkDefault(k), 'id="shrBox"')}
    <p class="note">原文件不动，另存一份「_压缩」</p>
    <div class="foot"><button class="btn" data-cancel>取消</button><button class="btn pri" data-ok>开始压缩</button></div>`;
  const target = await dialog(html, () => { const t = shrinkRead($('#shrBox')); if(t < 1000){ toast('请选一个目标大小', true); return false } return t });
  if(!target) return;

}

/* ---------------- 剪辑音视频 */
const fmtClock = t => { t = Math.max(0, t||0); const m = Math.floor(t/60), s = t - m*60; return `${m}:${s.toFixed(1).padStart(4,'0')}` };
const parseClock = s => { const p = String(s).trim().split(':').map(Number); if(p.some(isNaN)) return NaN; return p.reduce((a,b)=>a*60+b, 0) };
async function trimDialog(it){
  let info; try{ info = await api('/api/media/info?path='+enc(it.path)) }catch(e){ info = {direct:true, duration:0, video:it.kind==='video'} }
  document.querySelectorAll('audio,video').forEach(m => { try{ m.pause() }catch(_){} });
  const D = info.duration || 0, isV = it.kind==='video';
  const T = {s:0, e:D, off:0, dur:D};
  $('#dlg').classList.add('wide');
  const html = `<h3>剪辑</h3><p class="muted">${esc(it.name)} · 拖动两端选出要保留的部分</p>
    <div class="tr-m ${isV?'':'aud'}">${isV?'<video id="trV" playsinline></video>':'<audio id="trV"></audio><div class="tr-wave">'+catSvg('audio',40)+'</div>'}</div>
    <div class="tr-bar" id="trBar"><i></i><span class="tr-sel" id="trSel"></span><b class="tr-h" data-h="s"></b><b class="tr-h" data-h="e"></b><u id="trPh"></u></div>
    <div class="tr-row">
      <label>开始<input type="text" id="trS"><button type="button" class="lk" data-set="s">用当前位置</button></label>
      <button type="button" class="pbtn big" id="trPlay" title="播放选中部分">${ICON.play}</button>
      <label>结束<input type="text" id="trE"><button type="button" class="lk" data-set="e">用当前位置</button></label>
    </div>
    <p class="note" id="trInfo" style="text-align:center"></p>
    <div class="foot"><button class="btn" data-cancel>取消</button><button class="btn pri" data-ok>保存这一段</button></div>`;
  let v, playingSel = false;
  const cur = () => (v ? v.currentTime : 0) + T.off;
  const seek = t => { t = Math.max(0, Math.min(T.dur || t, t));
    if(info.direct){ v.currentTime = t }
    else { T.off = t; v.src = streamUrl(it.path, t, !isV); v.play().catch(()=>{}) } };
  const pos = t => (T.dur ? t / T.dur * 100 : 0) + '%';
  const draw = () => {
    $('#trSel').style.left = pos(T.s); $('#trSel').style.width = `calc(${pos(T.e)} - ${pos(T.s)})`;
    $('#trBar [data-h="s"]').style.left = pos(T.s); $('#trBar [data-h="e"]').style.left = pos(T.e);
    if(document.activeElement !== $('#trS')) $('#trS').value = fmtClock(T.s);
    if(document.activeElement !== $('#trE')) $('#trE').value = fmtClock(T.e);
    const len = T.e - T.s;
    $('#trInfo').textContent = `保留 ${fmtClock(len)}` + (isV ? (len <= 180 ? ' · 精确到每一帧' : ' · 较长片段用无损快剪，几秒就好') : '');
  };
  const tick = () => { if(!v || !$('#trPh')) return; const t = cur(); $('#trPh').style.left = pos(t);
    if(playingSel && t >= T.e){ v.pause(); playingSel = false } $('#trPlay').innerHTML = v.paused ? ICON.play : ICON.pause };
  setTimeout(() => {
    v = $('#trV'); v.preload = 'auto';
    if(info.direct) v.src = '/api/file?path='+enc(it.path); else v.src = streamUrl(it.path, 0, !isV);
    v.addEventListener('loadedmetadata', () => { if(!T.dur && isFinite(v.duration)){ T.dur = v.duration; T.e = v.duration; draw() } });
    v.addEventListener('timeupdate', tick); v.addEventListener('play', tick); v.addEventListener('pause', tick);
    draw();
    const bar = $('#trBar');
    let drag = null;
    const tAt = e => { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * T.dur };
    bar.onpointerdown = e => { if(!T.dur) return; const h = e.target.closest('.tr-h');
      if(h){ drag = h.dataset.h; bar.setPointerCapture(e.pointerId); e.preventDefault() } else seek(tAt(e)) };
    bar.onpointermove = e => { if(!drag) return; const t = tAt(e);
      if(drag==='s') T.s = Math.min(t, T.e - 0.2); else T.e = Math.max(t, T.s + 0.2); draw() };
    bar.onpointerup = () => { if(drag){ seek(drag==='s' ? T.s : Math.max(T.s, T.e - 2)); drag = null } };
    $('#trPlay').onclick = () => { if(!v.paused){ v.pause(); playingSel = false; return }
      const t = cur(); if(t < T.s || t >= T.e - 0.05) seek(T.s); playingSel = true; v.play().catch(()=>{}) };
    $('#dlg').querySelectorAll('[data-set]').forEach(b => b.onclick = () => { const t = cur();
      if(b.dataset.set==='s') T.s = Math.min(t, T.e - 0.2); else T.e = Math.max(t, T.s + 0.2); draw() });
    for(const [id,key] of [['#trS','s'],['#trE','e']]){ const inp = $(id);
      inp.onkeydown = e => { e.stopPropagation(); if(e.key==='Enter') inp.blur() };
      inp.onchange = () => { const t = parseClock(inp.value); if(!isNaN(t)){ if(key==='s') T.s = Math.max(0, Math.min(t, T.e - 0.2)); else T.e = Math.min(T.dur, Math.max(t, T.s + 0.2)); seek(T[key]) } draw() } }
  }, 0);
  const res = await dialog(html, () => (T.e - T.s >= 0.2 ? {start:+T.s.toFixed(3), end:+T.e.toFixed(3)} : false));
  try{ v.pause(); v.removeAttribute('src'); v.load() }catch(_){}
  $('#dlg').classList.remove('wide');
  if(res) startJob('trim', [it.path], res);
}

async function pagesDialog(it){

  $('#dlg').classList.add('wide');
  const html = `<h3>整理页面</h3><p class="muted">${esc(it.name)} · 点选页面后旋转或删除，拖动可以调整顺序</p>

    <div class="foot"><a class="lk" id="pgSplit" style="margin-right:auto">每页拆成一个 PDF</a><button class="btn" data-cancel>取消</button><button class="btn pri" data-ok id="pgOk">保存新 PDF</button></div>`;
  const render = () => {
    const sel = pages.filter(p=>p.on).length;
    $('#pgTb').innerHTML = `<span>${sel ? `已选 ${sel} 页` : `共 ${pages.length} 页`}</span>
      <button class="btn ghost" data-pg="all">${sel===pages.length&&sel?'取消全选':'全选'}</button>
      <span class="sp"></span>
      <button class="btn ghost" data-pg="l" title="向左转">↺ 左转</button><button class="btn ghost" data-pg="r" title="向右转">↻ 右转</button>
      <button class="btn ghost" data-pg="del" ${sel?'':'disabled'}>删除</button>
      <button class="btn ghost" data-pg="undo" ${hist.length?'':'disabled'}>撤销</button>`;
    $('#pgGrid').innerHTML = pages.map((p, k) => `<div class="pg ${p.on?'on':''}" data-k="${k}" draggable="true">
      <div class="pg-im"><img loading="lazy" src="/api/pdf/thumb?path=${enc(it.path)}&i=${p.i}&w=240" style="transform:rotate(${p.rot}deg)" alt=""></div>
      <span>${p.i+1}${p.rot?` · ${p.rot}°`:''}</span><i class="ck ${p.on?'on':''}"></i></div>`).join('') || '<div class="im-empty">页面都删掉了，点「撤销」恢复</div>';
    $('#pgOk').disabled = !pages.length;
    $('#pgOk').textContent = pages.length ? `保存新 PDF（${pages.length} 页）` : '保存新 PDF';
  };
  const snap = () => { hist.push(JSON.stringify(pages)); if(hist.length > 50) hist.shift() };
  let dragK = null;
  setTimeout(() => {
    render();
    $('#pgTb').onclick = e => { const b = e.target.closest('[data-pg]'); if(!b) return; const a = b.dataset.pg;
      const sel = pages.filter(p=>p.on), tgt = sel.length ? sel : pages;
      if(a==='all'){ const all = sel.length===pages.length; pages.forEach(p=>p.on=!all) }
      else if(a==='l' || a==='r'){ snap(); tgt.forEach(p => p.rot = (p.rot + (a==='r'?90:270)) % 360) }
      else if(a==='del'){ snap(); pages = pages.filter(p=>!p.on) }
      else if(a==='undo' && hist.length){ pages = JSON.parse(hist.pop()) }
      render() };
    $('#pgGrid').onclick = e => { const c = e.target.closest('.pg'); if(!c) return; const p = pages[+c.dataset.k]; p.on = !p.on; render() };
    $('#pgGrid').ondragstart = e => { const c = e.target.closest('.pg'); if(!c) return; dragK = +c.dataset.k; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain','pg'); e.stopPropagation() };
    $('#pgGrid').ondragover = e => { if(dragK===null) return; e.preventDefault(); e.stopPropagation();
      document.querySelectorAll('.pg.drop').forEach(x=>x.classList.remove('drop')); const c = e.target.closest('.pg'); if(c) c.classList.add('drop') };
    $('#pgGrid').ondrop = e => { if(dragK===null) return; e.preventDefault(); e.stopPropagation(); const c = e.target.closest('.pg');
      if(c && +c.dataset.k !== dragK){ snap(); const [m] = pages.splice(dragK, 1); pages.splice(+c.dataset.k, 0, m) } dragK = null; render() };
    $('#pgGrid').ondragend = e => { dragK = null; e.stopPropagation(); document.querySelectorAll('.pg.drop').forEach(x=>x.classList.remove('drop')) };
    $('#pgSplit').onclick = () => { if(!pages.length) return; $('#pgSplit').dataset.go = '1'; $('#pgOk').click() };
  }, 0);
  const res = await dialog(html, () => pages.length ? {mode: $('#pgSplit').dataset.go ? 'split' : 'save', pages: pages.map(p=>[p.i, p.rot])} : false);
  $('#dlg').classList.remove('wide');
  if(res) startJob('pdf_pages', [it.path], res);
}

/* ---------------- 任务 */
async function startJob(op, paths, options){
  try{ const j = await api('/api/job', {op, paths, options: options||{}}); S.jobs.unshift(j); S.jobsOpen = true; renderJobs(); pollJobs(true) }
  catch(e){ fail(e) }
}
let pollT;
async function pollJobs(now){
  clearTimeout(pollT);
  try{
    const list = await api('/api/jobs'); S.jobs = list;
    let changed = false; const justDone = [];
    for(const j of list){
      const prev = S.lastJobState[j.id];
      if(prev && prev!==j.status && ['done','error','cancelled'].includes(j.status)){
        changed = true; if(j.status==='done') justDone.push(...j.outputs);
        const fromConv = S.conv.files.some(f=>f.jobId===j.id);
        if(fromConv) {}  // 转换页自己显示结果
        else if(j.status==='done') toast(`完成：${j.title}`);
        else if(j.status==='error') toast(`失败：${j.title}`, true);
      }
      S.lastJobState[j.id] = j.status;
    }
    renderJobs(); convSync(list);
    if(changed) loadStats();
    if(changed && !S.searching && S.page==='lib') go(S.cwd).then(()=>{ /* 高亮当前目录下的新文件 */
      const fresh = justDone.filter(o=>parentOf(o)===S.cwd);
      fresh.slice(-20).forEach(o=>{ const el=document.querySelector(`.row[data-p="${CSS.escape(o)}"]`); if(el) el.classList.add('flash') }) });
  }catch(e){}
  const active = S.jobs.some(j=>['queued','running'].includes(j.status)) || S.clientJobs.some(j=>j.status==='running') || S.conv?.running;
  autoHideJobs(active);
  pollT = setTimeout(pollJobs, active ? 600 : 4000);
}
let hideT = null, wasActive = false;
function autoHideJobs(active){
  if(active){ clearTimeout(hideT); hideT = null }
  else if(wasActive && S.jobsOpen && !hideT){
    hideT = setTimeout(() => { hideT = null; if(!$('#jobs').matches(':hover') && !S.jobs.some(j=>j.status==='error' && S.lastJobState[j.id]==='error' && Date.now()/1000 - j.created < 30)){ S.jobsOpen = false; renderJobs() } }, 5000);
  }
  wasActive = active;
}
function renderJobs(){
  const convIds = new Set(S.conv.files.map(f=>f.jobId).filter(Boolean));
  const all = [...S.clientJobs, ...S.jobs.filter(j=>!convIds.has(j.id))];
  const active = all.filter(j=>['queued','running'].includes(j.status)).length;
  $('#jobsFab').innerHTML = active ? `<span class="dot on" style="background:var(--acc)"></span>${active} 个任务进行中` : `任务 · ${all.length}`;
  $('#jobsFab').classList.toggle('on', active > 0 && !S.jobsOpen);
  $('#jobs').classList.toggle('on', !!all.length && S.jobsOpen);
  const stName = {queued:'排队中',running:'',done:'完成',error:'失败',cancelled:'已取消'};
  $('#jobList').innerHTML = all.map(j => {
    const pct = Math.round(j.progress*100);
    const outs = (j.outputs||[]).slice(0,6).map(o=>`<button data-out="${esc(o)}" title="${esc(o)}">${esc(o.split('/').pop())}</button>`).join('') + ((j.outputs||[]).length>6?`<span style="font-size:12px;color:var(--ink3)">等 ${j.outputs.length} 个</span>`:'');
    const pwNeeded = j.status==='error' && /密码/.test((j.errors||[]).join('')) && j.title.startsWith('解压');
    return `<div class="job"><div class="t"><b title="${esc(j.title)}">${esc(j.title)}</b>
      <span class="st ${j.status==='done'?'ok':j.status==='error'?'err':''}">${j.status==='running'?pct+'%':stName[j.status]}</span>
      ${['queued','running'].includes(j.status) && !j.client ? `<button class="x" data-cancel-job="${j.id}">取消</button>`:''}</div>
      ${['queued','running'].includes(j.status)?`<div class="pb"><i style="width:${pct}%"></i></div>${j.current?`<div style="font-size:11.5px;color:var(--ink3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(j.current)}</div>`:''}`:''}
      ${outs?`<div class="o">${outs}</div>`:''}
      ${(j.notes||[]).length?`<div class="e" style="color:var(--ink3)">${esc(j.notes.slice(0,3).join('\n'))}</div>`:''}
      ${(j.errors||[]).length?`<div class="e">${esc(j.errors.slice(0,3).join('\n'))}</div>`:''}
      ${pwNeeded?`<div class="o"><button data-pw="${j.id}">输入密码重试</button></div>`:''}</div>`;
  }).join('');
}

function imSince(){
  const d = new Date(); d.setHours(0,0,0,0);

    try{
      for(const b of batches){
        const fd = new FormData(); fd.append('path', dest);
        b.forEach(x => { fd.append('files', x.file, x.file.name); fd.append('rel', x.rel) });
        const r = await new Promise((res, rej) => {
          const xhr = new XMLHttpRequest(); xhr.open('POST','/api/upload');
          xhr.upload.onprogress = ev => onProgress && onProgress(Math.min((sent + ev.loaded)/total, .99));
          xhr.onload = () => { let j={}; try{ j=JSON.parse(xhr.responseText) }catch(_){}; xhr.status<300? res(j) : rej(new Error(j.error||'上传失败')) };
          xhr.onerror = () => rej(new Error('网络错误，上传中断'));
          xhr.send(fd);
        });
        sent += b.reduce((s,x)=>s+x.file.size,0);
        out.saved.push(...(r.saved||[]));
        for(const k in (r.placed||{})) out.placed[k] = (out.placed[k]||0) + r.placed[k];
      }
      resolve(out);
    }catch(e){ reject(e) }
  });
}
async function upload(list){
  if(!list.length) return;
  const dest = S.cwd;
  const cj = {id:'u'+Date.now(), client:true, title:`导入 ${list.length===1?list[0].rel:list.length+' 个文件'}`, status:'running', progress:0, outputs:[], errors:[]};
  S.clientJobs.unshift(cj); S.jobsOpen = true; renderJobs();
  try{
    const r = await uploadTo(dest, list, f => { cj.progress = f; renderJobs() });
    cj.outputs = r.saved.slice(0, 50); cj.status='done'; cj.progress=1;
    const where = Object.entries(r.placed).map(([k,n])=>`${k} ${n}`).join(' · ');
    toast(where ? '已放好：' + where : '已添加');
  }catch(e){ cj.status='error'; cj.errors=[e.message]; fail(e) }
  renderJobs(); loadStats();

}

function barSet(bar, frac, buf){ const f=Math.max(0,Math.min(1,frac||0)); bar.querySelector('b').style.width=(f*100)+'%'; bar.querySelector('u').style.left=(f*100)+'%'; if(buf!==undefined && bar.querySelector('s')) bar.querySelector('s').style.width=(Math.min(1,buf)*100)+'%' }
function barDrag(bar, onSeek, onPreview){
  bar.addEventListener('pointerdown', e => {
    bar.setPointerCapture(e.pointerId);
    const at = ev => { const r=bar.getBoundingClientRect(); return Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)) };
    onPreview && onPreview(at(e));
    const mv = ev => onPreview && onPreview(at(ev));
    const up = ev => { bar.removeEventListener('pointermove',mv); bar.removeEventListener('pointerup',up); onSeek(at(ev)) };

  });

/* 一个能在"直接播放"和"转码串流"之间切换的媒体源 */
function Source(el, audioOnly){
  const o = {el, path:null, info:null, offset:0, streaming:false, dur:0};
  o.load = async (path, info, start=0, autoplay=true) => {
    o.path = path; o.info = info; o.dur = info.duration || 0;
    o.streaming = !info.direct; o.offset = o.streaming ? start : 0;
    el.src = o.streaming ? streamUrl(path, start, audioOnly) : fileUrl(path);
    if(!o.streaming && start) el.addEventListener('loadedmetadata', () => { el.currentTime = start }, {once:true});
    if(autoplay) el.play().catch(()=>{});
  };
  o.time = () => o.offset + (el.currentTime||0);
  o.duration = () => o.dur || (isFinite(el.duration) ? el.duration : 0);
  o.seek = t => { t = Math.max(0, Math.min(t, (o.duration()||1e9) - 0.5));
    if(o.streaming){ const playing = !el.paused; o.offset = t; el.src = streamUrl(o.path, t, audioOnly); if(playing || true) el.play().catch(()=>{}) }
    else el.currentTime = t };
  o.fallback = () => { if(o.streaming || !S.info.tools.ffmpeg) return false; const t = o.time(); o.streaming = true; o.offset = t; el.src = streamUrl(o.path, t, audioOnly); el.play().catch(()=>{}); return true };
  return o;
}

const MP = { audio:new Audio(), queue:[], idx:-1, mode:'order', src:null, order:[] };

async function mpLoad(i){
  if(!MP.queue.length) return;
  MP.idx = (i + MP.queue.length) % MP.queue.length;
  const tr = MP.queue[MP.idx];
  document.body.classList.add('has-player'); $('#player').classList.add('on');

  $('#mpCover').innerHTML = ICON.note;
  let info; try{ info = await api('/api/media/info?path='+enc(tr.path)) }catch(e){ info = {direct:true, duration:0, title:tr.name, artist:''} }
  if(MP.queue[MP.idx] !== tr) return;
  tr.title = info.title; tr.artist = info.artist;
  $('#mpTitle').textContent = info.title || tr.name;
  $('#mpArtist').textContent = [info.artist, info.album].filter(Boolean).join(' · ') || tr.name;
  const img = new Image(); img.onload = () => { $('#mpCover').innerHTML=''; $('#mpCover').appendChild(img) }; if(info.cover) img.src = '/api/media/cover?path='+enc(tr.path);
  await MP.src.load(tr.path, info);
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({title: info.title||tr.name, artist: info.artist||'', album: info.album||'', artwork: info.cover ? [{src: img.src, sizes:'512x512'}] : []});
  }
  renderQueue(); markPlaying();
}
function mpNext(manual){
  if(!MP.queue.length) return;
  if(MP.mode==='one' && !manual){ MP.src.seek(0); MP.audio.play(); return }
  if(MP.mode==='shuffle'){ let n; do{ n = Math.floor(Math.random()*MP.queue.length) }while(MP.queue.length>1 && n===MP.idx); return mpLoad(n) }
  mpLoad(MP.idx+1);
}
function mpPrev(){ if(MP.src.time() > 4) return MP.src.seek(0); mpLoad(MP.idx-1) }
function mpToggle(){ if(!MP.queue.length) return; MP.audio.paused ? MP.audio.play() : MP.audio.pause() }
function mpClose(){ MP.audio.pause(); MP.audio.removeAttribute('src'); MP.audio.load(); MP.queue=[]; MP.idx=-1; $('#player').classList.remove('on'); document.body.classList.remove('has-player'); $('#mpQueue').classList.remove('on'); markPlaying() }
function renderMode(){ $('#mpMode').innerHTML = ICON[MP.mode]; $('#mpMode').title = {order:'列表循环',one:'单曲循环',shuffle:'随机播放'}[MP.mode]; $('#mpMode').classList.toggle('on', MP.mode!=='order') }
function renderQueue(){
  $('#mpQueue').innerHTML = `<h5>播放列表 · ${MP.queue.length} 首</h5>` + MP.queue.map((t,i)=>`<button data-qi="${i}" class="${i===MP.idx?'cur':''}"><em>${i===MP.idx?'<span class="eq"><i></i><i></i><i></i></span>':i+1}</em><span>${esc(t.title||t.name)}</span></button>`).join('');

function markPlaying(){

// 字幕：自己解析 VTT 并按串流偏移校正时间
function parseVtt(txt){
  const cues = []; const ts = s => { const p = s.trim().split(':').map(Number); return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1] };
  for(const blk of txt.replace(/\r/g,'').split(/\n\n+/)){
    const lines = blk.split('\n'); const i = lines.findIndex(l=>l.includes('-->')); if(i<0) continue;
    const [a,b] = lines[i].split('-->'); const text = lines.slice(i+1).join('\n').replace(/<[^>]+>/g,'').replace(/\{\\[^}]*\}/g,'').trim();
    if(text) cues.push([ts(a), ts(b.trim().split(/\s/)[0]), text]);
  }
  return cues;
}

function wipeCues(){ if(!subTrack) return; subTrack.mode='hidden'; while(subTrack.cues && subTrack.cues.length) subTrack.removeCue(subTrack.cues[0]) }

  const s = VP.info.subs.find(x=>x.id===id); $('#vpSubBtn').textContent = '字幕：'+(s? s.label : '开');

  for(const [a,b,t] of VP.cues){ if(b-off <= 0) continue; try{ const c = new VTTCue(Math.max(0,a-off), b-off, t); c.line = -4; subTrack.addCue(c) }catch(_){} }

}

function vpKey(e){

async function addConvFiles(list){
  if(!list.length) return;
  if(S.conv.running) return toast('正在转换，请等这一批完成', true);
  if(S.conv.files.length && S.conv.files.every(f=>f.status==='done'||f.status==='error')) S.conv.files = [];  // 上一批已完成：开始新一批
  if(!S.conv.batch){ const b = 'b' + Date.now(); try{ await api('/api/mkdir', {path:'stage', name:b}); S.conv.batch = 'stage/'+b }catch(e){ return fail(e) } }
  const entries = list.map(x => { const f = convFile(x.file.name, x.file.size); S.conv.files.push(f); return f });
  renderConv();

    const r = await uploadTo(S.conv.batch, list.map(x=>({file:x.file, rel:x.file.name})), p => { entries.forEach(f=>f.progress=p); renderConvList() });
    entries.forEach((f,i) => { f.path = r.saved[i]; f.name = (r.saved[i]||'').split('/').pop() || f.name; f.status = 'ready'; f.progress = 0 });
  }catch(e){ entries.forEach(f => { f.status='error'; f.error=e.message }) }

    else if(k==='image' && !['mp4','webm'].includes(fmt)){
      if(['jpg','webp','avif'].includes(fmt)){ if(o.quality===undefined) o.quality = 85; opt += `<div><label>画质 <b id="q_${k}">${o.quality}</b></label><div class="rng"><input type="range" min="40" max="100" value="${o.quality}" data-k="${k}" data-o="quality"></div></div>` }
      opt += `<div><label>尺寸（按最长边缩小）</label>${seg('max_side',[['0','原始'],['3840','4K'],['1920','1920'],['1280','1280'],['800','800']],'0')}</div>`;
    }
    if(fmt!=='shrink' && (k==='video' || k==='audio' || (k==='image' && ['mp4','webm'].includes(fmt)))){
      const audioOnly = ['mp3','wav','flac','m4a','ogg','opus'].includes(fmt);
      if(!['wav','flac'].includes(fmt)) opt += `<div><label>${audioOnly?'音质':'画质'}</label>${seg('vquality',[['high','高'],['medium','标准'],['small','小体积']],'medium')}</div>`;
      if(!audioOnly) opt += `<div><label>分辨率</label>${seg('height',[['0','原始'],['1080','1080p'],['720','720p'],['480','480p']], fmt==='gif'?'480':'0')}</div>`;
    }
    if(k==='pdf' && ['png','jpg'].includes(fmt)) opt += `<div><label>清晰度</label>${seg('dpi',[['96','普通'],['150','清晰'],['300','打印']],'150')}</div>`;
    const merge = k==='image' && fmt==='pdf' && files.length>1;
    parts.push(`<div class="cg"><h4>${kinds.length>1 ? GROUP_NAME[k].trim()+'转成' : '转成'}</h4>
      <div class="fmts" data-k="${k}">${targets.map(t=>`<button type="button" data-f="${t}" class="${t===fmt?'on':''} ${t==='shrink'?'wide':''}">${t==='shrink'?'缩小体积':t.toUpperCase()}</button>`).join('')}</div>
      ${fmt==='shrink'?`<div class="opt" style="margin-top:12px"><label>压到多大以内（每个文件）</label>${shrinkPicker(shrinkKind(k), o.target, `data-k="${k}"`)}</div>`:''}
      ${merge?`<label class="chk"><input type="checkbox" data-k="${k}" data-o="merge" ${o.merge?'checked':''}>合并成一个 PDF</label>`:''}
      ${fmt==='gif'?'<div class="note">GIF 体积较大，适合几秒钟的短片段</div>':''}
      ${k==='pdf'&&fmt==='docx'?'<div class="note">复杂排版转 Word 可能会走样</div>':''}
      ${opt?`<details ${S.conv.openOpts?.[k]?'open':''} data-k="${k}"><summary>${{image:'画质与尺寸',video:'画质与分辨率',audio:'音质',pdf:'清晰度'}[k]||'更多设置'}</summary><div class="opt">${opt}</div></details>`:''}</div>`);
  }
  R.innerHTML = parts.join('');
  renderConvFoot();
}
function renderConvFoot(){
  const groups = convGroups(); const ready = S.conv.files.filter(f=>f.status==='ready' && GROUP_NAME[f.kind] && S.conv.choice[f.kind]);
  const done = S.conv.files.filter(f=>f.status==='done').length, err = S.conv.files.filter(f=>f.status==='error').length;
  let t = '';
  if(S.conv.running) t = `已完成 ${done} / ${S.conv.files.filter(f=>f.jobId).length}`;
  else if(ready.length) t = '转好的文件会自动存进「我的文件」';
  else if(done || err) t = `转好了 ${done} 个${err?`，${err} 个没成功`:''}`;
  $('.conv-foot').hidden = !S.conv.files.length;
  $('#convSum').textContent = t;
  const finished = !S.conv.running && !ready.length && (done || err);
  $('#convGo').disabled = !finished && (S.conv.running || !ready.length || S.conv.files.some(f=>f.status==='uploading'));
  $('#convGo').textContent = S.conv.running ? '正在转换…' : finished ? '再转一批' : `转换 ${ready.length} 个文件`;
  $('#convGo').classList.toggle('pri', !finished);
}
function renderConv(){ renderConvList(); renderConvRight(); renderCats() }

$('#convLeft').addEventListener('click', e => {
  if(e.target.closest('#pickLib') || e.target.closest('#pickLib2')){ e.preventDefault(); e.stopPropagation(); return pickFromLibrary() }
  if(e.target.closest('#convDrop') || e.target.closest('#convAdd') || e.target.closest('#convAdd2')) return $('#convIn').click();
  if(e.target.closest('#convClear')){ S.conv.files = []; S.conv.batch = null; renderConv(); return }
  const rm = e.target.closest('[data-rm]'); if(rm){ S.conv.files = S.conv.files.filter(f=>f.id!==rm.dataset.rm); renderConv(); return }
  const op = e.target.closest('[data-open]'); if(op && op.dataset.open){ go(parentOf(op.dataset.open), op.dataset.open); return }
  const dl = e.target.closest('[data-dl]'); if(dl && dl.dataset.dl){ location.href = '/api/file?dl=1&path='+enc(dl.dataset.dl) }
});
$('#convIn').onchange = e => { const fs=[...e.target.files].map(f=>({file:f, rel:f.name})); e.target.value=''; addConvFiles(fs) };
$('#convRight').addEventListener('click', e => {
  const fb = e.target.closest('.fmts button'); if(fb){ const k = fb.parentElement.dataset.k; S.conv.choice[k] = fb.dataset.f; try{ localStorage.setItem('mb.fmt.'+k, fb.dataset.f) }catch(_){}; renderConvRight(); return }
  const sb = e.target.closest('.seg button'); if(sb){ const g = sb.parentElement; S.conv.opts[g.dataset.k][g.dataset.o] = sb.dataset.v; g.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===sb)); return }
});
shrinkWire($('#convRight'), box => { const o = S.conv.opts[box.dataset.k]; if(o) o.target = shrinkRead(box) });
$('#convRight').addEventListener('input', e => { const t = e.target; if(t.dataset.o==='quality'){ S.conv.opts[t.dataset.k].quality = +t.value; const q=$('#q_'+t.dataset.k); if(q) q.textContent = t.value } });
$('#convRight').addEventListener('change', e => { const t = e.target; if(t.type==='checkbox') S.conv.opts[t.dataset.k][t.dataset.o] = t.checked });
$('#convRight').addEventListener('toggle', e => { const d = e.target; if(d.tagName==='DETAILS'){ S.conv.openOpts = S.conv.openOpts || {}; S.conv.openOpts[d.dataset.k] = d.open } }, true);

$('#convGo').onclick = async () => {
  if($('#convGo').textContent === '再转一批'){ S.conv.files = []; S.conv.batch = null; renderConv(); return }
  const groups = convGroups(); S.conv.running = true;
  for(const k of Object.keys(groups)){
    const fmt = S.conv.choice[k]; const files = groups[k].filter(f=>f.status==='ready'); if(!fmt || !files.length) continue;
    const o = S.conv.opts[k] || {};
    try{
      if(fmt==='shrink'){ const j = await api('/api/job', {op:'shrink', paths: files.map(f=>f.path), options:{target: o.target || shrinkDefault(shrinkKind(k))}});
        try{ localStorage.setItem('mb.shrink.'+shrinkKind(k), o.target) }catch(_){}
        files.forEach(f => { f.jobId = j.id; f.status = 'queued' }); continue }
      const j = await api('/api/job', {op:'convert', paths: files.map(f=>f.path), options:{format:fmt, quality:+(o.quality||85), max_side:+(o.max_side||0),
        vquality:o.vquality||'medium', height:+(o.height||0), dpi:+(o.dpi||150), merge:!!o.merge}});
      files.forEach(f => { f.jobId = j.id; f.status = 'queued' });
    }catch(e){ files.forEach(f => { f.status='error'; f.error=e.message }) }
  }
  S.conv.running = S.conv.files.some(f=>f.status==='queued');
  renderConv(); pollJobs(true);
};
function convSync(jobs){
  if(!S.conv.files.some(f=>f.jobId)) return;
  let changed = false;
  for(const f of S.conv.files){
    if(!f.jobId || f.status==='done' || f.status==='error') continue;
    const j = jobs.find(x=>x.id===f.jobId); if(!j) continue;
    const it = (j.items||[]).find(x=>x.src===f.path);
    if(it && (it.outputs.length || it.error)){
      if(it.error){ f.status='error'; f.error=it.error } else { f.status='done'; f.outputs=it.outputs; f.note=it.note||'' }
      changed = true; continue;
    }
    if(['error','cancelled'].includes(j.status)){ f.status='error'; f.error=(j.errors||[]).join('；')||'已取消'; changed = true; continue }
    if(j.status==='done'){ f.status='done'; f.outputs=j.outputs; changed = true; continue }
    if(j.status==='running' && j.current===f.name){ f.status='running'; f.progress = Math.max(0, Math.min(1, j.progress*j.total - j.done)); changed = true }
    else if(f.status!=='queued' && f.status!=='running'){ f.status='queued'; changed = true }
  }
  const was = S.conv.running;
  S.conv.running = S.conv.files.some(f=>f.status==='queued'||f.status==='running');
  if(changed || was !== S.conv.running){ renderConvList(); renderConvFoot() }
  if(was && !S.conv.running){ const n = S.conv.files.filter(f=>f.status==='done').length; toast(`转换好了 ${n} 个，已存进「我的文件」`); loadStats(); renderConvRight() }
}
async function pickFromLibrary(){
  let cur = 'lib'; const picked = new Map();
  const html = `<h3>从我的文件里选</h3><p class="muted">勾选要转换的文件</p><div class="crumbs" id="pkCrumbs" style="font-size:13px"></div><div class="tree" id="pkTree"></div>
    <div class="foot"><button class="btn" data-cancel>取消</button><button class="btn pri" data-ok id="pkOk">添加</button></div>`;
  const load = async vp => {
    cur = vp; const r = await api('/api/list?path='+enc(vp));
    const parts = vp.split('/'); let acc='';
    $('#pkCrumbs').innerHTML = parts.map((p,i)=>{acc=i?acc+'/'+p:p; return `<button data-pk="${esc(acc)}">${esc(i?p:'我的文件')}</button>`}).join('<span class="sep">/</span>');
    const items = r.items.sort((a,b)=>(b.dir-a.dir)||a.name.localeCompare(b.name,'zh'));
    $('#pkTree').innerHTML = items.map(it => it.dir
      ? `<button data-pk="${esc(it.path)}"><span style="color:var(--k-dir)">${FOLDER_SVG.replace(/28/g,'18')}</span>${esc(it.name)}</button>`
      : `<button data-pf="${esc(it.path)}" class="${picked.has(it.path)?'on':''}"><span class="ck ${picked.has(it.path)?'on':''}"></span>${esc(it.name)}<span style="margin-left:auto;color:var(--ink3);font-size:12px">${fmtSize(it.size)}</span></button>`).join('')
      || '<div style="padding:10px;color:var(--ink3);font-size:13px">这里没有文件</div>';
    $('#pkTree')._items = items;
  };
  setTimeout(() => { load(cur).catch(fail);
    const h = e => { const d = e.target.closest('[data-pk]'); if(d) return load(d.dataset.pk).catch(fail);
      const f = e.target.closest('[data-pf]'); if(f){ const it = $('#pkTree')._items.find(x=>x.path===f.dataset.pf); picked.has(it.path) ? picked.delete(it.path) : picked.set(it.path, it);
        f.classList.toggle('on'); f.querySelector('.ck').classList.toggle('on'); $('#pkOk').textContent = picked.size ? `添加 ${picked.size} 个` : '添加' } };
    $('#pkTree').onclick = h; $('#pkCrumbs').onclick = h }, 0);
  const ok = await dialog(html, () => true);
  if(ok && picked.size) sendToConverter([...picked.values()]);
}

init().catch(e => { document.body.innerHTML = `<div class="empty"><b>无法连接 MiniBox</b>${esc(e.message)}</div>` });
